[pytest]
# Cache en carpeta temporal para evitar pytest-cache-files-* por permisos OneDrive
cache_dir = $TEMP/pytest-cache-finanzas

# Tests NO incluidos (proyectos externos / legacy)
# VolSurface: tests de otro proyecto (requieren pyodbc + DB IvyDBUS)
# legacy: tests legacy
testpaths = Codigo/tests
norecursedirs = VolSurface legacy
